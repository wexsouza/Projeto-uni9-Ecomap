<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Doador — Ecomaps</title>
  <meta name="description" content="Painel do doador Ecomaps: materiais, solicitações de coleta e pontos de coleta." />
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="dashboard-doador.html">
        <img src="assets/logo.png" alt="Logotipo Ecomaps" width="40" height="40" />
        <span>Eco<strong>map</strong></span>
      </a>
      <div class="header-right">
        <span class="badge badge-doador">Doador</span>
        <button class="btn btn-ghost" id="btnSair">SAIR</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="dash-hello">Olá, <span id="nomeUsuario">usuário</span>!</h1>
      <p class="section-sub left">Gerencie seus materiais recicláveis e suas solicitações de coleta.</p>

      <div class="cards-4">
        <button class="dash-card" data-info="Aqui você cadastraria os materiais que possui: papel, plástico, vidro, metal e eletrônicos.">
          <span class="dash-ico">♻️</span><h3>Meus Materiais</h3><p>Cadastre o que você separou.</p>
        </button>
        <button class="dash-card" data-info="Aqui você escolheria data, horário e endereço para um coletor buscar seus materiais.">
          <span class="dash-ico">🚚</span><h3>Solicitar Coleta</h3><p>Agende uma coleta em casa.</p>
        </button>
        <button class="dash-card" data-info="Aqui apareceria o mapa com os pontos de coleta próximos ao seu endereço.">
          <span class="dash-ico">📍</span><h3>Pontos de Coleta</h3><p>Encontre um ponto próximo.</p>
        </button>
        <button class="dash-card" data-info="Aqui ficaria o histórico das suas solicitações e o status de cada uma.">
          <span class="dash-ico">🗂️</span><h3>Minhas Solicitações</h3><p>Acompanhe seus pedidos.</p>
        </button>
      </div>

      <div class="alert alert-info" id="alerta" hidden></div>

      <section class="profile">
        <h2>Meu perfil</h2>
        <ul class="profile-list">
          <li><strong>Nome</strong><span id="pNome">—</span></li>
          <li><strong>Telefone</strong><span id="pTelefone">—</span></li>
          <li><strong>Endereço</strong><span id="pEndereco">—</span></li>
          <li><strong>E-mail</strong><span id="pEmail">—</span></li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p>Protótipo Ecomaps — dados armazenados apenas no navegador.</p></div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
