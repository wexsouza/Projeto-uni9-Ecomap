<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Coletor — Ecomaps</title>
  <meta name="description" content="Cadastre-se como coletor no Ecomaps e comece a realizar coletas de recicláveis." />
  <link rel="icon" href="logo%20EcoMap/logo.jpeg" type="image/jpeg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-bg"></div>

  <main class="auth-wrap">
    <div class="auth-card auth-card-wide">
      <a class="brand brand-center" href="index.html">
        <img src="logo%20EcoMap/logo.jpeg" alt="Logotipo Ecomaps" width="48" height="48" />
        <span>Eco<strong>map</strong></span>
      </a>

      <span class="badge badge-coletor">Conta de Coletor</span>
      <h1 class="auth-title">Cadastro de Coletor</h1>
      <p class="auth-sub">Cadastre seus dados para começar a realizar coletas.</p>

      <div class="alert" id="alerta" hidden></div>

      <form id="formColetor" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Maria Souza" />
          <small class="error" id="erroNome"></small>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="cpf">CPF</label>
            <!-- Máscara 000.000.000-00 aplicada em js/cadastro.js -->
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" />
            <small class="error" id="erroCpf"></small>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="voce@email.com" />
            <small class="error" id="erroEmail"></small>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(11) 99999-9999" maxlength="15" />
            <small class="error" id="erroTelefone"></small>
          </div>
          <div class="field">
            <label for="estadoCivil">Estado civil</label>
            <select id="estadoCivil">
              <option value="">Selecione...</option>
              <option>Solteiro(a)</option>
              <option>Casado(a)</option>
              <option>Divorciado(a)</option>
              <option>Viúvo(a)</option>
              <option>União estável</option>
            </select>
            <small class="error" id="erroEstadoCivil"></small>
          </div>
        </div>

        <div class="field">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" placeholder="Av. Paulista, 1000 — São Paulo/SP" />
          <small class="error" id="erroEndereco"></small>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" />
            <small class="error" id="erroSenha"></small>
          </div>
          <div class="field">
            <label for="senha2">Confirmar senha</label>
            <input type="password" id="senha2" placeholder="Repita a senha" />
            <small class="error" id="erroSenha2"></small>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">CADASTRAR COMO COLETOR</button>
      </form>

      <p class="auth-foot">Já possui uma conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
